name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['GameSaveBackup.ps1', 'build.bat', '.github/workflows/build.yml']
  pull_request:
    branches: [master]
    paths: ['GameSaveBackup.ps1', 'build.bat', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run build.bat
        shell: cmd
        run: |
          if exist GameSaveBackup.exe del /f /q GameSaveBackup.exe
          call build.bat GameSaveBackup.ps1 <nul

      - name: Commit and push
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          git config --local core.autocrlf false
          git config --local core.safecrlf false
          git config --local core.ignorecase false
          git config --local core.quotepath false
          git config --local i18n.logoutputencoding utf-8
          git config --local i18n.commitencoding utf-8
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "auto-build [ GameSaveBackup.exe ]"
            git pull --rebase origin master
            git push origin HEAD
          } else {
            Write-Host 'No changes after build.'
          }
