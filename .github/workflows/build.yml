name: build

on:
  schedule:
    - cron: '57 21 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['source/GameSaveBackup.ps1', 'build/build.bat', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Git Config
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false
          git config --global core.ignorecase false
          git config --global core.quotepath false
          git config --global i18n.logoutputencoding utf-8
          git config --global i18n.commitencoding utf-8
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Run build.bat
        shell: cmd
        run: |
          if exist "source\GameSaveBackup.exe" ( del /f /q "source\GameSaveBackup.exe" )
          if exist "build\GameSaveBackup.exe" ( del /f /q "build\GameSaveBackup.exe" )
          call "build\build.bat" "source\GameSaveBackup.ps1" <nul
          move /y "source\GameSaveBackup.exe" "build\GameSaveBackup.exe"

      - name: Commit and push
        shell: powershell
        run: |
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto-build by [ build.bat ]"
            git pull origin master
            git push origin HEAD
          } else {
            Write-Host 'No changes after build.'
          }
